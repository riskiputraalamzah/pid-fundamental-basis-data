<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 206" width="800" height="206" role="img" aria-label="Diagram Relasi One to Many antara Tabel Kategori dan Tabel Barang">
  <rect x="0" y="0" width="800" height="206" fill="#FBF9F4"/>

  <!-- Left Table: kategori -->
  <rect x="30" y="30" width="270" height="148" rx="10" fill="#111827"/>
  <rect x="24" y="24" width="270" height="148" rx="10" fill="#FFFFFF" stroke="#111827" stroke-width="3"/>
  <path d="M24 34 Q24 24 34 24 H284 Q294 24 294 34 V62 H24 Z" fill="#2563EB" stroke="#111827" stroke-width="3"/>
  <text x="159" y="48" font-family="Consolas, Courier New, monospace" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TABEL: kategori</text>

  <rect x="38" y="76" width="242" height="34" rx="6" fill="#FACC15" stroke="#111827" stroke-width="2"/>
  <text x="50" y="98" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="bold" fill="#111827">[PK] id_kategori (INT)</text>

  <rect x="38" y="120" width="242" height="34" rx="6" fill="#F5F0E6" stroke="#111827" stroke-width="1.8"/>
  <text x="50" y="142" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="600" fill="#111827">nama_kategori (VARCHAR)</text>

  <!-- Relation Connector -->
  <path d="M296 93 C374 93, 408 138, 488 138" stroke="#111827" stroke-width="4" fill="none" stroke-dasharray="8 6"/>
  <circle cx="296" cy="93" r="8" fill="#FACC15" stroke="#111827" stroke-width="2.5"/>
  <circle cx="488" cy="138" r="8" fill="#10B981" stroke="#111827" stroke-width="2.5"/>

  <!-- 1:N Badge -->
  <rect x="328" y="57" width="136" height="30" rx="6" fill="#111827"/>
  <rect x="324" y="53" width="136" height="30" rx="6" fill="#EDE9FE" stroke="#111827" stroke-width="2.5"/>
  <text x="392" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="900" fill="#111827" text-anchor="middle">1 : N (One-to-Many)</text>

  <!-- Right Table: barang -->
  <rect x="496" y="20" width="280" height="170" rx="10" fill="#111827"/>
  <rect x="490" y="14" width="280" height="170" rx="10" fill="#FFFFFF" stroke="#111827" stroke-width="3"/>
  <path d="M490 24 Q490 14 500 14 H760 Q770 14 770 24 V52 H490 Z" fill="#10B981" stroke="#111827" stroke-width="3"/>
  <text x="630" y="38" font-family="Consolas, Courier New, monospace" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">TABEL: barang</text>

  <rect x="504" y="62" width="252" height="26" rx="5" fill="#FEF3C7" stroke="#111827" stroke-width="1.8"/>
  <text x="514" y="80" font-family="Consolas, Courier New, monospace" font-size="11.5" font-weight="bold" fill="#111827">[PK] id_barang (VARCHAR)</text>

  <rect x="504" y="94" width="252" height="24" rx="5" fill="#F5F0E6" stroke="#111827" stroke-width="1.5"/>
  <text x="514" y="110" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#111827">nama_barang (VARCHAR)</text>

  <rect x="504" y="124" width="252" height="28" rx="5" fill="#D1FAE5" stroke="#111827" stroke-width="2"/>
  <text x="514" y="142" font-family="Consolas, Courier New, monospace" font-size="11.5" font-weight="bold" fill="#064E3B">[FK] id_kategori (INT)</text>

  <rect x="504" y="157" width="252" height="20" rx="4" fill="#F5F0E6"/>
  <text x="514" y="171" font-family="Consolas, Courier New, monospace" font-size="11" fill="#374151">stok (INT), harga (INT)</text>
</svg>
