<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 132" width="800" height="132" role="img" aria-label="Hirarki Basis Data: Database, Tabel, Kolom, dan Baris">
  <rect x="0" y="0" width="800" height="132" fill="#FBF9F4"/>

  <!-- Step 1: Database -->
  <rect x="20" y="20" width="166" height="96" rx="10" fill="#111827"/>
  <rect x="15" y="15" width="166" height="96" rx="10" fill="#111827" stroke="#111827" stroke-width="2.5"/>
  <rect x="27" y="25" width="100" height="20" rx="4" fill="#FACC15"/>
  <text x="77" y="39" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="900" fill="#111827" text-anchor="middle">1. DATABASE</text>
  <text x="98" y="70" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">db_minimarket</text>
  <text x="98" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">Lemari Arsip Utama</text>

  <path d="M188 63 H210 M203 56 L211 63 L203 70" stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2: Tabel -->
  <rect x="223" y="20" width="166" height="96" rx="10" fill="#111827"/>
  <rect x="218" y="15" width="166" height="96" rx="10" fill="#2563EB" stroke="#111827" stroke-width="2.5"/>
  <rect x="230" y="25" width="82" height="20" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
  <text x="271" y="39" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="900" fill="#111827" text-anchor="middle">2. TABEL</text>
  <text x="301" y="70" font-family="Consolas, Courier New, monospace" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">barang, kategori</text>
  <text x="301" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#DBEAFE" text-anchor="middle">Map Khusus per Entitas</text>

  <path d="M391 63 H413 M406 56 L414 63 L406 70" stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3: Kolom -->
  <rect x="426" y="20" width="166" height="96" rx="10" fill="#111827"/>
  <rect x="421" y="15" width="166" height="96" rx="10" fill="#10B981" stroke="#111827" stroke-width="2.5"/>
  <rect x="433" y="25" width="90" height="20" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
  <text x="478" y="39" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="900" fill="#111827" text-anchor="middle">3. KOLOM</text>
  <text x="504" y="70" font-family="Consolas, Courier New, monospace" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="middle">id, nama, stok</text>
  <text x="504" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#064E3B" text-anchor="middle">Atribut &amp; Tipe Data</text>

  <path d="M594 63 H616 M609 56 L617 63 L609 70" stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 4: Baris -->
  <rect x="629" y="20" width="156" height="96" rx="10" fill="#111827"/>
  <rect x="624" y="15" width="156" height="96" rx="10" fill="#FACC15" stroke="#111827" stroke-width="2.5"/>
  <rect x="636" y="25" width="84" height="20" rx="4" fill="#111827"/>
  <text x="678" y="39" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="900" fill="#FACC15" text-anchor="middle">4. BARIS</text>
  <text x="702" y="70" font-family="Consolas, Courier New, monospace" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="middle">1 Data Produk</text>
  <text x="702" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#422006" text-anchor="middle">Record / Isi Nyata</text>
</svg>
